    tagline: "Eight years building developer tools at the intersection of Web3 and real-world utility.\n"
    bio:
      - "I got into crypto to solve a real problem: my uncle in Spain needs to send money to family in Moldova, and the existing rails are broken. When I saw USDC kiosks appearing in remote European towns, I knew stablecoins had crossed from speculation to infrastructure. That's the Circle I want to help build—not just a stablecoin, but the developer platform that makes global value transfer as simple as an API call.\n"
      - "At Anchorage, I led the EVM integration team shipping 8 protocol integrations at 4× industry speed. Before that, I built Ankr's Advanced API serving 1M+ daily requests and SDK suite with 1,900+ weekly downloads. At Dapper, I improved Flow developer onboarding by 60%. The thread through my career is the same: {{accent}}make it easier for developers to build on blockchain{{/accent}}. Now I'm researching agent-to-agent transactions—AI agents that can hold wallets, transact autonomously, and use USDC as their native currency. Circle is building the infrastructure that makes this possible.\n"
