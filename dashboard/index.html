<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>CV Variants Dashboard</title>
  <style>
    :root {
      --bg: #0a0a0b;
      --bg-card: #141416;
      --border: #2a2a2e;
      --text: #fafafa;
      --text-muted: #71717a;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #22c55e;
      --green-muted: #166534;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* Password Gate */
    #gate {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .gate-box {
      background: #1a1a1f;
      border: 1px solid #3b82f6;
      border-radius: 12px;
      padding: 2rem;
      max-width: 320px;
      width: 100%;
      box-shadow: 0 0 40px rgba(59, 130, 246, 0.15);
    }

    .gate-box h2 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      font-weight: 500;
    }

    .gate-box input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    .gate-box input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .gate-box button {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .gate-box button:hover {
      background: var(--accent-hover);
    }

    .error {
      color: #ef4444;
      font-size: 0.875rem;
      margin-top: 0.5rem;
      display: none;
    }

    /* Dashboard */
    #dashboard {
      display: none;
      padding: 2rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
    }

    .search-bar {
      margin-bottom: 1.5rem;
    }

    .search-bar input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
    }

    .search-bar input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .search-bar input::placeholder {
      color: var(--text-muted);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.875rem;
    }

    td {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .company {
      font-weight: 500;
    }

    .role {
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .date {
      color: var(--text-muted);
      font-size: 0.875rem;
      white-space: nowrap;
    }

    .actions {
      text-align: right;
      white-space: nowrap;
    }

    .btn {
      display: inline-block;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.875rem;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      margin-left: 0.5rem;
    }

    .btn-secondary:hover {
      border-color: var(--text-muted);
      color: var(--text);
    }

    .variant-row.hidden {
      display: none;
    }

    .stats {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
      padding: 1rem;
      background: var(--bg-card);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--accent);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Status Toggle */
    .status-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.375rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      white-space: nowrap;
    }

    .status-toggle.not-applied {
      background: rgba(113, 113, 122, 0.2);
      color: var(--text-muted);
    }

    .status-toggle.not-applied:hover {
      background: rgba(34, 197, 94, 0.2);
      color: var(--green);
    }

    .status-toggle.applied {
      background: rgba(34, 197, 94, 0.2);
      color: var(--green);
    }

    .status-toggle.applied:hover {
      background: rgba(113, 113, 122, 0.2);
      color: var(--text-muted);
    }

    .status-toggle:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .status-toggle .icon {
      font-size: 0.875rem;
    }

    /* Loading state */
    #loading {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }

    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 0.5rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      #dashboard {
        padding: 1rem;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .btn-secondary {
        margin-left: 0;
      }

      th:nth-child(2),
      td.date {
        display: none;
      }

      th:nth-child(3),
      td:nth-child(3) {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- Password Gate -->
  <div id="gate">
    <div class="gate-box">
      <h2>🔐 Dashboard Access</h2>
      <input type="password" id="password" placeholder="Enter access code" autofocus>
      <button onclick="checkPassword()">Enter</button>
      <p class="error" id="error">Incorrect code</p>
    </div>
  </div>

  <!-- Dashboard (hidden until authenticated) -->
  <div id="dashboard">
    <header>
      <h1>CV Variants Dashboard</h1>
      <p>Quick access to all portfolio variants</p>
    </header>

    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="total-count">-</div>
        <div class="stat-label">Total Variants</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="applied-count">-</div>
        <div class="stat-label">Applied</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="pending-count">-</div>
        <div class="stat-label">Not Applied</div>
      </div>
    </div>

    <div class="search-bar">
      <input type="text" id="search" placeholder="Search by company or role..." oninput="filterVariants()">
    </div>

    <div id="loading">
      <div class="spinner"></div>
      <div>Loading variants...</div>
    </div>

    <table id="variants-table" style="display: none;">
      <thead>
        <tr>
          <th>Variant</th>
          <th>Created</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="variants-body">
      </tbody>
    </table>
  </div>

  <script type="module">
    import { ConvexHttpClient } from "https://esm.sh/convex@1.22.0/browser";

    // Convex setup
    const CONVEX_URL = "https://scintillating-husky-549.convex.cloud";
    const client = new ConvexHttpClient(CONVEX_URL);

    // Simple hash function for password (not cryptographically secure, just obscurity)
    const HASH = 'nxt2ji';

    // Store variants in memory for filtering
    let variants = [];

    // Track in-flight mutations to prevent race conditions
    const pendingMutations = new Set();

    // Store pending filter query for filter-during-load race condition
    let pendingFilterQuery = null;

    // Track initialization state to prevent multiple showDashboard calls
    let isInitializing = false;
    let isInitialized = false;

    function simpleHash(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        const char = str.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash;
      }
      return hash.toString(36);
    }

    function checkPassword() {
      const input = document.getElementById('password').value;
      if (simpleHash(input) === HASH) {
        localStorage.setItem('dashboard_auth', 'true');
        showDashboard();
      } else {
        document.getElementById('error').style.display = 'block';
      }
    }

    async function showDashboard() {
      // Prevent multiple calls (race condition during rapid auth)
      if (isInitializing || isInitialized) return;
      isInitializing = true;

      document.getElementById('gate').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';

      try {
        await loadVariants();
        isInitialized = true;
      } finally {
        isInitializing = false;
      }
    }

    async function loadVariants(retryCount = 0) {
      const MAX_RETRIES = 3;
      const RETRY_DELAY_MS = 1000;

      try {
        variants = await client.query("variants:listAll");

        // Sort by generatedAt date (newest first)
        variants.sort((a, b) => {
          const dateA = new Date(a.generatedAt || a.updatedAt || 0);
          const dateB = new Date(b.generatedAt || b.updatedAt || 0);
          return dateB - dateA;
        });

        renderVariants();
        updateStats();
      } catch (error) {
        console.error(`Failed to load variants (attempt ${retryCount + 1}/${MAX_RETRIES + 1}):`, error);

        if (retryCount < MAX_RETRIES) {
          // Show retry status
          document.getElementById('loading').innerHTML =
            `<div class="spinner"></div><div>Retrying... (${retryCount + 1}/${MAX_RETRIES})</div>`;

          // Wait and retry
          await new Promise(resolve => setTimeout(resolve, RETRY_DELAY_MS * (retryCount + 1)));
          return loadVariants(retryCount + 1);
        }

        // Max retries exceeded
        document.getElementById('loading').innerHTML =
          '<div style="color: #ef4444;">Failed to load variants after multiple attempts.</div>' +
          '<button onclick="location.reload()" style="margin-top: 1rem; padding: 0.5rem 1rem; ' +
          'background: var(--accent); border: none; border-radius: 6px; color: white; cursor: pointer;">' +
          'Retry</button>';
      }
    }

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-US', {
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });
    }

    function renderVariants() {
      const tbody = document.getElementById('variants-body');
      const baseUrl = 'https://fotescodev.github.io/portfolio';

      tbody.innerHTML = variants.map(v => {
        const statusClass = v.applicationStatus === 'applied' ? 'applied' : 'not-applied';
        const statusLabel = v.applicationStatus === 'applied' ? 'Applied' : 'Not Applied';
        const statusIcon = v.applicationStatus === 'applied' ? '&#10003;' : '&#9675;';

        return `
          <tr class="variant-row" data-company="${(v.company || '').toLowerCase()}" data-role="${(v.role || '').toLowerCase()}" data-slug="${v.slug}">
            <td>
              <div class="company">${v.company || 'Unknown'}</div>
              <div class="role">${v.role || 'Unknown Role'}</div>
            </td>
            <td class="date">${formatDate(v.generatedAt)}</td>
            <td>
              <button
                class="status-toggle ${statusClass}"
                onclick="window.toggleStatus('${v.slug}', '${v.applicationStatus}')"
                title="Click to toggle status"
              >
                <span class="icon">${statusIcon}</span>
                ${statusLabel}
              </button>
            </td>
            <td class="actions">
              <a href="${baseUrl}/${v.slug}" target="_blank" class="btn btn-primary">View</a>
              ${v.sourceUrl ? `<a href="${v.sourceUrl}" target="_blank" class="btn btn-secondary">Job Post</a>` : ''}
            </td>
          </tr>
        `;
      }).join('');

      document.getElementById('loading').style.display = 'none';
      document.getElementById('variants-table').style.display = 'table';

      // Apply any pending filter query from filter-during-load
      if (pendingFilterQuery !== null) {
        const savedQuery = pendingFilterQuery;
        pendingFilterQuery = null;
        // Set the search input value and apply filter
        document.getElementById('search').value = savedQuery;
        filterVariants();
      }
    }

    function updateStats() {
      const total = variants.length;
      const applied = variants.filter(v => v.applicationStatus === 'applied').length;
      const pending = total - applied;

      document.getElementById('total-count').textContent = total;
      document.getElementById('applied-count').textContent = applied;
      document.getElementById('pending-count').textContent = pending;
    }

    window.toggleStatus = async function(slug, currentStatus) {
      // Prevent concurrent mutations on the same variant
      if (pendingMutations.has(slug)) return;
      pendingMutations.add(slug);

      const newStatus = currentStatus === 'applied' ? 'not_applied' : 'applied';

      // Optimistic update - update UI immediately
      const variant = variants.find(v => v.slug === slug);
      if (variant) {
        variant.applicationStatus = newStatus;
      }
      renderVariants();
      updateStats();

      try {
        await client.mutation("variants:updateApplicationStatus", {
          slug,
          applicationStatus: newStatus
        });
      } catch (error) {
        console.error('Failed to update status:', error);
        // Rollback on failure
        if (variant) {
          variant.applicationStatus = currentStatus;
        }
        renderVariants();
        updateStats();
        alert('Failed to update status. Please try again.');
      } finally {
        pendingMutations.delete(slug);
      }
    };

    function filterVariants() {
      const query = document.getElementById('search').value.toLowerCase();
      const rows = document.querySelectorAll('.variant-row');

      // If no rows exist yet (still loading), store query for later
      if (rows.length === 0) {
        pendingFilterQuery = query;
        return;
      }

      rows.forEach(row => {
        const company = row.dataset.company;
        const role = row.dataset.role;
        const matches = company.includes(query) || role.includes(query);
        row.classList.toggle('hidden', !matches);
      });
    }

    // Make filterVariants available globally for the oninput handler
    window.filterVariants = filterVariants;

    // Check if already authenticated
    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkPassword();
    });

    // Make checkPassword available globally
    window.checkPassword = checkPassword;

    if (localStorage.getItem('dashboard_auth') === 'true') {
      showDashboard();
    }
  </script>
</body>
</html>
